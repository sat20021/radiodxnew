<script>
const T=[
{n:'Thomson scattering',g:'ELASTIC SCATTERING',v:'thomson',h:`<p>A low-energy photon is really an oscillating electric field. A free electron placed in it is pushed up and down at the <b>same frequency</b>, and like any accelerating charge it re-radiates. The result: the photon is redirected with <b>no energy loss</b> and no ionization.</p><ul><li>Valid when photon energy ≪ 511 keV (hν ≪ mₑc²).</li><li>Cross-section per electron σₜ = 0.665 barn (6.65×10⁻²⁵ cm²), <b>independent of energy</b>.</li><li>Scattered λ = incident λ → it is <b>coherent</b>.</li><li>Atom version (all electrons together) is Rayleigh scattering: below ~30 keV, a few % of interactions in tissue. It adds slight fog to the image but deposits no dose.</li></ul><div class="f">λ′ = λ   |   E′ = E   |   Energy absorbed = 0</div><div class="pic"><b>Picture it:</b> a cork floating on a pond. A wave passes, the cork bobs at the same rhythm and sends out its own ripples of equal spacing. Cork keeps no energy.</div>`},
{n:'Compton scattering',g:'INCOHERENT SCATTERING',v:'compton',h:`<p>The photon hits a <b>loosely bound outer-shell electron</b> (binding energy ≪ photon energy, so it acts as if free). The photon is deflected and loses energy; the electron is ejected as a <b>recoil (Compton) electron</b>. The atom is left ionized.</p><div class="f">E′ = E / [1 + (E/511 keV)(1 − cosθ)]<br>Eₑ = E − E′</div><ul><li>θ = 0°: no loss. θ = 180° (backscatter): maximum loss.</li><li>Example: 100 keV at 90° → E′ = 83.6 keV, electron gets 16.4 keV. At 180°: E′ = 71.9 keV.</li><li>Probability ∝ electron density, <b>independent of Z</b>. Per gram it is almost the same for all tissue (hydrogen is ~2× higher).</li><li>Falls slowly with energy (~1/E). Dominates soft tissue from ~30 keV to ~30 MeV.</li><li>Clinically: scatter fogs images (use grids) and is the main source of staff exposure.</li></ul><div class="pic"><b>Picture it:</b> a billiard ball (photon) strikes a stationary ball (electron). Both fly off, sharing the energy. Use the sliders above.</div>`},
{n:'Compton wavelength shift',g:'COMPTON SCATTERING',v:'compton',h:`<p>Compton's 1923 result: the scattered photon has a <b>longer wavelength</b>, and the increase depends only on the angle, not on the incident energy.</p><div class="f">Δλ = λ′ − λ = (h/mₑc)(1 − cosθ)<br>h/mₑc = 2.43 pm = 0.0243 Å (Compton wavelength)</div><ul><li>Maximum shift 2 × 2.43 = 4.86 pm at 180°.</li><li>Photon wavelength: λ(pm) = 1240 / E(keV). A 100 keV photon is 12.4 pm, so a 90° shift of 2.43 pm is a 20% change. A 10 MeV photon (0.124 pm) changes enormously in relative terms.</li><li>This shift is why the effect only becomes visible at short wavelength (X-rays); in visible light, λ ≈ 500 nm, so it is negligible.</li><li>Classical (Thomson) theory predicts <b>no</b> shift, so this proved the particle nature of light.</li></ul><div class="pic"><b>Picture it:</b> drag the θ slider and watch the scattered wave stretch. The bigger the angle, the more stretched.</div>`},
{n:'Photon absorption (photoelectric effect)',g:'PHOTON ABSORPTION',v:'pe',h:`<p>The photon is <b>completely absorbed</b> by an <b>inner-shell</b> electron (usually K). The electron leaves as a <b>photoelectron</b>. Photon disappears.</p><div class="f">Eₖₑ(photoelectron) = hν − E_binding<br>Requires hν ≥ E_binding</div><ul><li>Most likely when hν is <b>just above</b> the binding energy. Probability drops sharply as E rises (∝ 1/E³).</li><li><b>Absorption edge:</b> just at E = binding energy the probability jumps up. K-edges: iodine 33.2 keV, barium 37.4 keV, lead 88 keV.</li><li>The atom is left with a vacancy, which leads to characteristic X-rays or Auger electrons.</li><li>All photon energy is absorbed in the patient: high dose but great contrast. No scatter is produced.</li></ul><div class="pic"><b>Picture it:</b> the photon is a coin that must pay exactly the "exit fee" (binding energy); any extra becomes the electron's speed.</div>`},
{n:'Characteristic radiation',g:'AFTER ABSORPTION',v:'char',h:`<p>When an outer electron drops into the inner-shell vacancy, the energy difference is emitted as a photon. Because each element has unique shell energies, the photon is a <b>fingerprint</b> of that element.</p><div class="f">E(Kα) = E_binding(K) − E_binding(L)</div><ul><li>Tungsten: K binding 69.5 keV, Kα ≈ 59 keV, Kβ ≈ 67 keV.</li><li>Compare: L→K = Kα, M→K = Kβ; Kβ is always more energetic.</li><li><b>Fluorescent yield</b> (chance of photon vs Auger) rises with Z: ~0 for tissue, ~0.88 iodine, ~0.96 lead.</li><li>In tissue it is nearly never emitted; in lead aprons and detectors (CsI, Gd₂O₂S) it is a real effect.</li></ul><div class="pic"><b>Picture it:</b> a vacancy in the K shell is a vacant ground-floor seat; someone from the L floor jumps down and the "ticket price" is released as light.</div>`},
{n:'Auger effect',g:'AFTER ABSORPTION',v:'auger',h:`<p>An alternative to characteristic emission. The energy released when an outer electron fills the vacancy is passed <b>directly to another outer electron</b>, which is ejected: the <b>Auger electron</b>.</p><div class="f">E(Auger, KLL) ≈ E_K − 2·E_L</div><ul><li>Dominant in low-Z atoms (Z &lt; ~30), including all body tissue elements.</li><li>Auger electrons are very low energy (eV to a few keV): absorbed within nanometres–micrometres. No photon escapes.</li><li>The atom ends up <b>doubly ionized</b>.</li><li>Auger emitters (I-125, In-111) are used in targeted therapy because they damage DNA only at very short range.</li></ul><div class="pic"><b>Picture it:</b> the falling electron does not shout (photon); it hands the energy sideways to a neighbour who is thrown out.</div>`},
{n:'Photoelectric absorption and atomic number',g:'Z DEPENDENCE',v:'pe',h:`<p>The photoelectric effect depends very strongly on atomic number, which is why radiography has <b>contrast</b>.</p><div class="f">τ/ρ ∝ Z³ / E³   (per unit mass, approx.)</div><table><tr><th>Material</th><th>Z (effective)</th></tr><tr><td>Fat</td><td>6.3</td></tr><tr><td>Soft tissue</td><td>7.4</td></tr><tr><td>Bone</td><td>13.8</td></tr><tr><td>Iodine</td><td>53</td></tr><tr><td>Barium</td><td>56</td></tr><tr><td>Lead</td><td>82</td></tr></table><ul><li>Bone/soft tissue: (13.8/7.4)³ ≈ <b>6.5×</b> more absorption per gram. Iodine vs soft tissue: ≈ 370×.</li><li>Doubling the kVp reduces absorption ~8× (1/E³): contrast falls, dose falls.</li><li>Low kVp for mammography and contrast studies; high kVp for chest (reduces bone contrast).</li><li>Choosing a contrast agent: put its K-edge just below the beam's mean energy.</li></ul>`},
{n:'High-energy interactions (pair production)',g:'HIGH-ENERGY INTERACTIONS',v:'pair',h:`<p>A photon passing close to a nucleus can convert into matter: an <b>electron–positron pair</b>. Mass-energy of each is 0.511 MeV.</p><div class="f">Threshold: hν ≥ 2mₑc² = 1.022 MeV<br>KE(e⁻) + KE(e⁺) = hν − 1.022 MeV</div><ul><li>Probability ∝ Z² and increases with energy.</li><li><b>Triplet production</b> (in the field of an electron): threshold 2.044 MeV, much rarer.</li><li>Dominates above ~10 MeV in high-Z materials (~30 MeV in water/tissue).</li><li>Not relevant to diagnostic X-ray (max 150 kVp), but important in radiotherapy (linac) and PET physics (reverse process).</li><li>The positron slows and annihilates (see last topic).</li></ul><div class="pic"><b>Picture it:</b> energy → mass, E = mc² read backwards. The nucleus acts as a catalyst and takes tiny recoil.</div>`},
{n:'Photonuclear interactions',g:'HIGH-ENERGY INTERACTIONS',v:'nuc',h:`<p>A very high energy photon is absorbed by the <b>nucleus</b> itself, which ejects a nucleon: <b>photodisintegration</b>, mainly (γ,n).</p><div class="f">ᴬ₂X + γ → ᴬ⁻¹₂X + n    (hν ≥ threshold)</div><ul><li>Threshold ≈ 7–10 MeV for most nuclei (low: ⁹Be 1.7 MeV, ²H 2.2 MeV).</li><li>Peak (Giant Dipole Resonance) at ~10–25 MeV.</li><li>Cross-section is small compared with pair production, but the <b>neutrons</b> are penetrating and the residual nucleus is often radioactive.</li><li>Practical issue: linacs of ≥ 10 MV need neutron shielding in doors (polyethylene, borated) and activation of components.</li></ul>`},
{n:'Secondary radiation and electron interactions',g:'SECONDARY RADIATION',v:'ion',h:`<p>Photons are <b>indirectly ionizing</b>: they release charged particles, and those do the damage.</p><table><tr><th>Primary event</th><th>Secondary products</th></tr><tr><td>Rayleigh</td><td>Scattered photon only</td></tr><tr><td>Photoelectric</td><td>Photoelectron, characteristic X-ray / Auger</td></tr><tr><td>Compton</td><td>Recoil electron, scattered photon</td></tr><tr><td>Pair production</td><td>e⁻, e⁺ (then 2 × 511 keV photons)</td></tr><tr><td>Photonuclear</td><td>Neutron, activation products</td></tr></table><p>Fast electrons lose energy by <b>collisional</b> processes (excitation, ionization) and <b>radiative</b> processes (bremsstrahlung). At diagnostic energies, almost all energy is collisional and deposited locally.</p>`},
{n:'Bremsstrahlung production',g:'ELECTRON INTERACTIONS',v:'brems',h:`<p>"Braking radiation". A fast electron passing close to a nucleus is attracted and <b>deflected</b>. The change in motion radiates an X-ray photon.</p><ul><li>Photon may take anything from ~0 up to all of the electron's KE: <b>continuous spectrum</b>, E<sub>max</sub> = kVp.</li><li>Closer approach → bigger deflection → more energetic photon (rare).</li><li>Radiative yield ≈ 9×10⁻⁹ · Z · V(kV)… ⇒ roughly 1% at 100 kVp for tungsten (Z=74); about <b>99% becomes heat</b>.</li><li>Intensity ∝ Z (target) so tungsten is chosen. Emission is ∝ 1/m²: strong for electrons, negligible for protons.</li><li>Filtration removes low-E photons, raising the mean energy.</li></ul><div class="f">Efficiency ≈ 9×10⁻⁷ · Z · kVp  (kVp in kV, expressed as a fraction)</div>`},
{n:'Characteristic X-ray production',g:'ELECTRON INTERACTIONS',v:'char',h:`<p>The incident electron (in the tube) ejects an inner-shell electron of a target atom; the vacancy then yields characteristic radiation exactly like the photoelectric aftermath.</p><ul><li>Needs electron KE ≥ K binding energy: for tungsten, <b>kVp &gt; 69.5</b>. Below this, no K lines appear.</li><li>Appear as <b>sharp peaks</b> on top of the continuous brems spectrum.</li><li>Tungsten Kα 59 / Kβ 67 keV. Molybdenum 17.5/19.6 keV and rhodium 20.2/22.7 keV are used in mammography.</li><li>Tungsten L-lines (8–12 keV) are absorbed by the tube window and filter.</li><li>Changing mA changes the amount; changing kVp changes both amount and (above threshold) the lines; line energies never change.</li></ul>`},
{n:'Electron excitation and ionization',g:'ELECTRON INTERACTIONS',v:'exc',h:`<p>Most electron–atom collisions are with <b>orbital electrons</b>, not nuclei.</p><ul><li><b>Excitation:</b> an electron is raised to a higher shell and falls back: energy goes out as heat, IR or visible light (the basis of scintillators and screens).</li><li><b>Ionization:</b> the electron is stripped away completely. Ionization energy of tissue atoms ~10–25 eV; air needs W = 33.97 eV per ion pair.</li><li>The ejected electron, if energetic, is a <b>delta ray</b> and makes its own track.</li><li>At diagnostic energies >99% of tube energy ends up as heat; the leftover is brems and characteristic X-rays.</li><li>Electron energy loss per length (stopping power) rises as electrons slow: the Bragg peak-like end of track is why dose is deposited locally.</li></ul>`},
{n:'Secondary electron energy transfer',g:'ELECTRON INTERACTIONS',v:'compton',h:`<p>How much of the photon's energy is handed to electrons (which deposit it as dose) depends on photon energy and the interaction.</p><div class="f">T = E − E′     T<sub>max</sub> = E · 2α/(1+2α),  α = E/511 keV</div><table><tr><th>Photon E</th><th>Mean fraction to Compton electron</th></tr><tr><td>100 keV</td><td>0.14</td></tr><tr><td>1 MeV</td><td>0.44</td></tr><tr><td>10 MeV</td><td>0.68</td></tr></table><ul><li>Low energy: most energy stays with the <b>scattered photon</b> and leaves the patient (little dose, much scatter).</li><li>Photoelectric: all energy (less binding) goes to electron.</li><li>Maximum transfer: head-on collision (photon back-scattered 180°, electron forward).</li><li>Electron range at keV energies is micrometres to mm (local deposit); at MeV, cm (build-up region in radiotherapy).</li></ul><div class="pic"><b>Picture it:</b> set the energy slider to 1500 keV, θ to 180°, and compare the electron energy to 100 keV.</div>`},
{n:'Electron–positron annihilation',g:'HIGH-ENERGY INTERACTIONS',v:'ann',h:`<p>A positron slows by collisions, then meets an electron (often forming short-lived <b>positronium</b>). Both masses are converted to energy.</p><div class="f">e⁻ + e⁺ → γ(511 keV) + γ(511 keV)</div><ul><li>Photons leave <b>back to back (180°)</b>, from conservation of momentum, each with 511 keV (the rest energy mₑc²).</li><li>Total 1.022 MeV: exactly the pair-production threshold, the reverse reaction.</li><li><b>Basis of PET:</b> detectors register two 511 keV photons in coincidence, defining a line of response.</li><li>Positron range (F-18 ≈ 0.6 mm mean) and photon non-collinearity (~0.5°) limit spatial resolution.</li><li>Radiation safety: 511 keV photons from F-18 need heavier shielding than Tc-99m (140 keV).</li></ul>`}
];
const find=document.getElementById('find'),empty=document.getElementById('empty');
const advancedTopics=window.radiationMatterAdvancedTopics;
const topicNumberOffset=window.radiationMatterTopics.length;
const cv=document.getElementById('cv'),x=cv.getContext('2d');let cur=0,tm=0;

function C(a,b,r,f,s){x.beginPath();x.arc(a,b,r,0,7);if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=1.5;x.stroke()}}
function L(a,b,c,d,s,w){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.strokeStyle=s;x.lineWidth=w||2;x.stroke()}
function W(x0,y0,x1,y1,A,k,col,ph){const l=Math.hypot(x1-x0,y1-y0);if(l<2)return;const ux=(x1-x0)/l,uy=(y1-y0)/l;x.beginPath();for(let i=0;i<=40;i++){const s=i/40*l,o=A*Math.sin(k*s-ph);const px=x0+ux*s-uy*o,py=y0+uy*s+ux*o;i?x.lineTo(px,py):x.moveTo(px,py)}x.strokeStyle=col;x.lineWidth=2;x.stroke()}
function Tx(s,a,b,c){x.fillStyle=c||'#cbd5e1';x.font='13px system-ui';x.fillText(s,a,b)}
const Y='#fbbf24',B='#60a5fa',G='#94a3b8',R='#f87171';
const sc={
thomson(){const o=14*Math.sin(tm*10);W(10,130,270,130,16,.12,Y,tm*8);for(let i=0;i<3;i++){const r=(tm*50+i*40)%120;x.globalAlpha=1-r/120;C(280,130+o,r,0,Y);x.globalAlpha=1}C(280,130+o,7,B);Tx('Incident wave',20,100);Tx('Re-radiated: same λ, no energy lost',330,240);},
compton(){const t=+th.value*Math.PI/180,E=+en.value,E2=E/(1+E/511*(1-Math.cos(t))),p=(tm%4)/4;
const ph=Math.atan2(E2*Math.sin(t),E-E2*Math.cos(t));
if(p<.5){const px=20+p/.5*260;W(Math.max(px-80,10),130,px,130,10,.3,Y,tm*9);C(280,130,7,B)}else{const q=(p-.5)/.5,d=q*230,ux=Math.cos(t),uy=-Math.sin(t);
W(280+ux*Math.max(d-90,0),130+uy*Math.max(d-90,0),280+ux*d,130+uy*d,10,.3*E2/E,Y,tm*9);

Tx('E = '+E+' keV   θ = '+th.value+'°',14,24);Tx("Scattered E′ = "+E2.toFixed(1)+' keV',14,44,Y);Tx('Electron Eₑ = '+(E-E2).toFixed(1)+' keV',14,64,B);Tx('Δλ = '+(2.43*(1-Math.cos(t))).toFixed(2)+' pm  (λ′/λ = '+(E/E2).toFixed(2)+')',14,84);
document.getElementById('thv').textContent=th.value+'°';document.getElementById('env').textContent=E+' keV';},
atom(m){const a=tm*2,ph=tm%6,cx=280,cy=130;C(cx,cy,9,R);C(cx,cy,28,0,'#334155');C(cx,cy,58,0,'#334155');C(cx,cy,92,0,'#334155');
const kp=i=>[cx+28*Math.cos(a+i*Math.PI),cy+28*Math.sin(a+i*Math.PI)];const lp=i=>[cx+58*Math.cos(a*.7+i*1.57),cy+58*Math.sin(a*.7+i*1.57)];
const mode=m;
if(mode=='exc'||mode=='ion'){const ex=40+ph/1.5*200;
if(ph<1.5){C(Math.min(ex,240),130+(mode=='ion'?0:50),6,B);} else if(mode=='exc'){C(240+(ph-1.5)*80,180,6,B);}
for(let i=0;i<4;i++){if(i==0&&ph>1.5){if(mode=='exc'){const r=ph<4?92:58;C(cx+r*Math.cos(a*.7),cy+r*Math.sin(a*.7),5,B);if(ph>4&&ph<5.2)W(cx,cy-60,cx+(ph-4)*100,cy-120,5,.4,'#fb923c',tm*9)}else{const d=(ph-1.5)*70;C(cx+60+d,cy-30-d*.5,5,B);continue}}else{const[p,q]=lp(i);C(p,q,5,B)}}
for(let i=0;i<2;i++){const[p,q]=kp(i);C(p,q,5,B)}
Tx(mode=='exc'?'Excitation: shell electron jumps up, falls back → heat / light':'Ionization: electron ejected (delta ray), atom charged',14,24);return}
if(ph<1.5){const px=30+ph/1.5*(cx-28-30);W(Math.max(px-70,10),cy,px,cy,9,.3,Y,tm*9)}
for(let i=0;i<4;i++){if(ph>3.2&&ph<4.2&&i==0)continue;const[p,q]=lp(i);if(ph>=4.2&&mode=='auger'&&i==1){C(p+(ph-4.2)*90,q+(ph-4.2)*50,5,G);continue}C(p,q,5,B)}
const k0=kp(0),k1=kp(1);C(k1[0],k1[1],5,B);
if(ph<1.5)C(k0[0],k0[1],5,B);else{const d=ph-1.5;C(k0[0]+d*110,k0[1]-d*50,5,'#34d399');if(ph<3.5)C(k0[0],k0[1],6,0,Y);else C(k0[0],k0[1],5,B)}
if(ph>=4.2&&mode=='char'){const d=(ph-4.2)*110;W(cx,cy,cx-d,cy-d*.8,6,.4,'#fb923c',tm*9)}

pe(){sc.atom('pe')},char(){sc.atom('char')},auger(){sc.atom('auger')},exc(){sc.atom('exc')},ion(){sc.atom('ion')},

x.beginPath();for(let i=0;i<=40;i++){const[a,b]=P(i/40);i?x.lineTo(a,b):x.moveTo(a,b)}x.strokeStyle='#334155';x.lineWidth=1;x.stroke();
C(280,185,10,R);Tx('Nucleus (+)',245,215);const[a,b]=P(s);C(a,b,s>.5?5:8,s>.5?'#93c5fd':B);
if(s>.5){const d=(s-.5)*400;W(280,150,280+d*.8,150-d*.6,7,.3,Y,tm*9)}
